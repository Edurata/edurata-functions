name: list_gmail_unanswered
runtime: python3_10
description: |
  Bulk Gmail thread classifier for sender domains, using a rolling time window.

  The function searches inbound messages in the configured folders/labels from senderDomains in the window and
  keeps the latest inbound message per thread. It also searches Sent messages in the
  same window and marks a thread as answered when a listener-sent message is newer
  than the latest inbound one. It then checks existing drafts and marks a thread as
  unanswered if it is not answered and has no draft (or only an outdated draft).
interface:
  inputs:
    properties:
      GMAIL_API_KEY:
        type: env
        description: OAuth 2.0 Bearer token for Gmail API.
      senderDomains:
        type: array
        items:
          type: string
        description: >
          Optional sender domains to include (OR). When empty, all senders in mailFolderNames are considered.
      excludeDomains:
        type: array
        items:
          type: string
        description: Sender domains to exclude even when they match senderDomains.
      mailFolderNames:
        type: array
        items:
          type: string
        description: >
          Folders/labels to scan for inbound mail (OR). System folders: inbox, spam, trash, drafts, sent,
          important, starred. Custom Gmail labels are resolved by name. Defaults to inbox when empty.
        default:
          - inbox
      listenerEmail:
        type: string
        description: Optional listener mailbox to identify own sent messages.
      windowHours:
        type: number
        description: >
          Rolling lookback window in hours for inbound and sent mail. Use 0 for no time limit.
        default: 0
      pageSize:
        type: number
        description: Page size for Gmail list APIs (default 100, max 500).
        default: 100
      maxInboxPages:
        type: number
        description: Maximum number of inbox search pages to read (default 3).
        default: 3
      maxSentPages:
        type: number
        description: Maximum number of sent search pages to read (default 3).
        default: 3
      maxUnanswered:
        type: number
        description: Max unanswered thread IDs to return. Use 0 for no cap.
        default: 10
    required: []
  outputs:
    properties:
      unansweredThreadIds:
        type: array
        items:
          type: string
      answeredThreadIds:
        type: array
        items:
          type: string
      countUnanswered:
        type: number
      countAnswered:
        type: number
      sinceUsed:
        type: string
    required:
      - unansweredThreadIds
      - answeredThreadIds
      - countUnanswered
      - countAnswered
      - sinceUsed
