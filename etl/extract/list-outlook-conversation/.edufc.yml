name: list_outlook_conversation
runtime: nodejs20
description: |
  Fetches the last n messages in an Outlook conversation by conversationId via GET /me/messages
  (mailbox-wide), so messages in custom folders are included—not only Inbox and Sent Items.
  Returned messages are chronological oldest-first; inputs.top limits how many of the newest are kept.
interface:
  inputs:
    properties:
      OUTLOOK_API_KEY:
        type: env
        description: OAuth 2.0 Bearer token for Microsoft Graph.
      conversationId:
        type: string
        description: Outlook conversation ID (thread id) to fetch messages for.
      top:
        type: number
        description: Number of most recent messages to return (default 20, max 100).
        default: 20
    required:
      - conversationId
  outputs:
    properties:
      conversationId:
        type: string
        description: The conversation ID that was queried.
      messages:
        type: array
        description: Messages in the conversation, oldest first (after applying top as the last n chronologically).
      count:
        type: number
        description: Number of messages returned.
    required:
      - conversationId
      - messages
      - count
